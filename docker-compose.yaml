services:
  postgres:
    image: postgres:16-alpine
    container_name: bosun-postgres
    environment:
      POSTGRES_USER: bosun
      POSTGRES_PASSWORD: bosun
      POSTGRES_DB: bosun
    ports:
      - "5433:5432"   # 5433 to avoid clashing with any local postgres
    volumes:
      - bosun-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosun"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: bosun-qdrant
    ports:
      - "6333:6333"
    volumes:
      - bosun-qdrant:/qdrant/storage

volumes:
  bosun-pgdata:
  bosun-qdrant:
