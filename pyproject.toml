[project]
name = "nightorder-workspace"
version = "0.1.0"
description = "Nightorder - Enterprise Agentic Workflow Orchestration Platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "nightorder",
    "nightorder-example-hello-world",
]

[tool.uv.workspace]
members = ["kernel", "examples/hello_world"]

[tool.uv.sources]
nightorder = { workspace = true }
nightorder-example-hello-world = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
