# argo-smoke — proves the Argo executor against a real cluster with a tiny,
# clearly-labeled, self-cleaning workflow (P2: one self-contained unit).
# Requires: NIGHTORDER_KUBE_CONTEXT set on the worker + access to an Argo ns.
apiVersion: nightorder/v1
kind: Pipeline
name: argo-smoke
project: batch
description: Minimal real Argo Workflow submission via the argo executor.

parameters:
  - name: yearmonth
    resolver: activity
    activity: now_yearmonth

steps:
  - id: argo-echo
    name: Tiny alpine echo on the cluster
    executor: argo
    timeout_minutes: 15
    config:
      # Isolated e2e namespace — created by scripts/setup-argo-e2e-namespace.sh.
      # Its default SA carries the workflowtaskresults executor Role that the
      # shared argo namespace's SAs are missing.
      namespace: nightorder-e2e
      poll_seconds: 5
      timeout_seconds: 600
      manifest:
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          labels:
            nightorder/e2e-test: "true"
        spec:
          entrypoint: main
          activeDeadlineSeconds: 300
          ttlStrategy:
            secondsAfterCompletion: 600   # self-clean 10 min after finish
          podGC:
            strategy: OnWorkflowCompletion
          templates:
            - name: main
              container:
                # Cluster admission policy allows only mirrored registries.
                image: alpine:latest
                command: [sh, -c]
                args: ["echo nightorder e2e smoke {{params.yearmonth}} && sleep 5 && echo done"]
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 64Mi}
