name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nightorder
          POSTGRES_PASSWORD: nightorder
          POSTGRES_DB: nightorder
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nightorder"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --frozen

      - name: Build the UI the API serves
        working-directory: ui
        run: npm ci && npm run build

      - name: Start a Temporal dev server
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          "$HOME/.temporalio/bin/temporal" server start-dev --headless \
            --db-filename /tmp/temporal-ci.db > /tmp/temporal.log 2>&1 &
          for _ in $(seq 1 60); do
            "$HOME/.temporalio/bin/temporal" operator cluster health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "temporal did not become healthy"; cat /tmp/temporal.log; exit 1

      # Runs the thirteen tests that need no credentials. The advisory tests
      # skip without ANTHROPIC_API_KEY and the cluster tests are opt-in.
      - run: uv run pytest tests/e2e -q

  provenance:
    name: commit trailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # House style: a subject, and a body only where the reasoning is not
      # obvious. No authorship trailers of any kind.
      - name: Check commit trailers
        run: |
          if git log --format='%B' | grep -inE 'co-authored-by:|generated with|🤖|noreply@'; then
            echo "::error::commit messages must not carry authorship trailers"
            exit 1
          fi
          echo "no trailers found"

  vulncheck:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Python dependencies
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --disable-pip --no-deps -r /tmp/requirements.txt
      - name: UI dependencies
        working-directory: ui
        run: npm ci && npm audit --audit-level=moderate
