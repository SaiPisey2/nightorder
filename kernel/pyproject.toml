[project]
name = "nightorder"
version = "0.1.0"
description = "Nightorder kernel: spec interpreter, Temporal orchestration, extension registry, control-plane API"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.29,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "kubernetes>=31.0,<34",
    "asyncssh>=2.17,<3",
    "anthropic>=0.40,<1",
    "qdrant-client[fastembed]>=1.12,<2",
    "langgraph>=1.0.10,<2",
]

[project.optional-dependencies]
dev = []

[project.entry-points."nightorder.step_executors"]
script = "nightorder.builtins.executors:ScriptExecutor"
argo = "nightorder.builtins.executors:ArgoWorkflowExecutor"
remote_exec = "nightorder.builtins.executors:RemoteExecExecutor"
noop = "nightorder.builtins.executors:NoopExecutor"

[project.entry-points."nightorder.preflight_checks"]
file_exists = "nightorder.builtins.checks:FileExistsCheck"
http_ok = "nightorder.builtins.checks:HttpOkCheck"
command_succeeds = "nightorder.builtins.checks:CommandSucceedsCheck"
always_pass = "nightorder.builtins.checks:AlwaysPassCheck"
always_fail = "nightorder.builtins.checks:AlwaysFailCheck"

[project.entry-points."nightorder.param_resolvers"]
now_yearmonth = "nightorder.builtins.resolvers:NowYearMonthResolver"
env = "nightorder.builtins.resolvers:EnvResolver"
command = "nightorder.builtins.resolvers:CommandResolver"

[project.entry-points."nightorder.gate_channels"]
log = "nightorder.builtins.gate_channels:LogChannel"
webhook = "nightorder.builtins.gate_channels:WebhookChannel"
teams = "nightorder.builtins.gate_channels:TeamsChannel"

[project.scripts]
nightorder-worker = "nightorder.temporal.worker:main"
nightorder-api = "nightorder.api.main:main"
nightorder-relay = "nightorder.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightorder"]
