[project]
name = "bosun"
version = "0.1.0"
description = "Bosun kernel: spec interpreter, Temporal orchestration, extension registry, control-plane API"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.29,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "kubernetes>=31.0,<34",
    "asyncssh>=2.17,<3",
    "anthropic>=0.40,<1",
    "qdrant-client[fastembed]>=1.12,<2",
    "langgraph>=0.2.60,<0.4",
]

[project.optional-dependencies]
dev = []

[project.entry-points."bosun.step_executors"]
script = "bosun.builtins.executors:ScriptExecutor"
argo = "bosun.builtins.executors:ArgoWorkflowExecutor"
remote_exec = "bosun.builtins.executors:RemoteExecExecutor"
noop = "bosun.builtins.executors:NoopExecutor"

[project.entry-points."bosun.preflight_checks"]
file_exists = "bosun.builtins.checks:FileExistsCheck"
http_ok = "bosun.builtins.checks:HttpOkCheck"
command_succeeds = "bosun.builtins.checks:CommandSucceedsCheck"
always_pass = "bosun.builtins.checks:AlwaysPassCheck"
always_fail = "bosun.builtins.checks:AlwaysFailCheck"

[project.entry-points."bosun.param_resolvers"]
now_yearmonth = "bosun.builtins.resolvers:NowYearMonthResolver"
env = "bosun.builtins.resolvers:EnvResolver"
command = "bosun.builtins.resolvers:CommandResolver"

[project.entry-points."bosun.gate_channels"]
log = "bosun.builtins.gate_channels:LogChannel"
webhook = "bosun.builtins.gate_channels:WebhookChannel"
teams = "bosun.builtins.gate_channels:TeamsChannel"

[project.scripts]
bosun-worker = "bosun.temporal.worker:main"
bosun-api = "bosun.api.main:main"
bosun-relay = "bosun.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosun"]
